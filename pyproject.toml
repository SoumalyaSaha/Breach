[project]
name = "breach"
version = "0.1.0"
description = "Breach — an adversarial math-checking agent that tries to break your proof."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyfiglet>=1.0",
    "z3-solver>=4.13",
    "sympy>=1.13",
    "streamlit>=1.37",
    "streamlit-drawable-canvas>=0.9.3",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "groq>=0.11",
    "requests>=2.32",
]

[project.urls]
Homepage = "https://github.com/SoumalyaSaha/Breach"
Repository = "https://github.com/SoumalyaSaha/Breach"
Issues = "https://github.com/SoumalyaSaha/Breach/issues"

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[project.scripts]
breach = "src.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
